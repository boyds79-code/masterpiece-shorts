name: Generate masterpiece short

# 하루 2회 자동 실행 + 언제든 Actions 탭에서 "Run workflow"로 수동 실행도 가능합니다.
# process-video.yml(제작 과정 상상 재현, UTC 01:05/13:05)과 6시간씩 어긋나게 UTC
# 07:05/19:05로 잡아서, 두 워크플로를 합쳐 하루 총 4개 업로드(숨은 의미 2개 + 제작 과정
# 2개)가 6시간 간격으로 고르게 퍼지도록 했습니다 — 쿼터 계산 등 자세한 설명은
# process-video.yml의 주석과 README.md의 "자동 실행 스케줄" 섹션을 참고하세요.
#
# cron은 항상 UTC 기준입니다(https://crontab.guru) — 시간을 바꾸려면 아래 cron 값들을
# 수정하세요.
on:
  schedule:
    - cron: '5 7 * * *'
    - cron: '5 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 예정된 실행과 수동 실행이 겹쳐서 같은 그림을 동시에 건드리거나 커밋이 충돌하는 걸
# 막기 위해 동시 실행을 막습니다(process-video.yml과 동일한 패턴).
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # data/used-paintings.json, data/log.md를 다시 커밋해서 push해야 하므로
          # 기본 GITHUB_TOKEN이 아니라 PAT_TOKEN으로 checkout합니다 (다른 블로그 프로젝트와 동일 패턴).
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: npm ci

      - name: Generate script, audio, video and upload to YouTube
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
        run: npm run generate

      - name: Commit updated tracking files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used-paintings.json data/log.md
          git diff --cached --quiet && echo "변경 없음, 커밋 건너뜀" || git commit -m "Log video: ${PAINTING_TITLE:-unknown painting}"
          git push
