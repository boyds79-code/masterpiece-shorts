name: Generate masterpiece longform video + teaser shorts

# 자동 스케줄 없이, Actions 탭에서 "Run workflow"를 눌러 원할 때만 수동으로 실행합니다.
# 그림 하나를 골라 긴 영상(3분 이상, WHEN+WHY+HOW+숨은 의미) 1개와, 그 영상에서 발췌한
# 티저 쇼츠 2개("그리는 방법" / "숨은 의미")를 만들어 각각 비공개로 업로드합니다
# (daily-video.yml / process-video.yml과 동일한 "자동 초안 + 사람 검수" 철학).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    # 세그먼트 10개 나레이션 + 이미지 생성(3단계) + 영상 3개 조립/업로드까지 처리하므로
    # 기존 process 워크플로우보다 넉넉하게 잡습니다.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # data/used-paintings.json, data/log-longform.md를 다시 커밋해서 push해야 하므로
          # 기본 GITHUB_TOKEN이 아니라 PAT_TOKEN으로 checkout합니다.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: npm ci

      - name: Generate longform script, stage images, audio, assemble 3 videos and upload to YouTube
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
        run: npm run generate:longform

      - name: Commit updated tracking files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used-paintings.json data/log-longform.md
          git diff --cached --quiet && echo "변경 없음, 커밋 건너뜀" || git commit -m "Log longform video: ${PAINTING_TITLE:-unknown painting}"
          git push
